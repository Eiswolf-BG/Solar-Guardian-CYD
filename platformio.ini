[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 921600

; Dieses CYD hat 4MB Flash (per esptool flash_id bestaetigt) - passt zum
; esp32dev-Board-Default, hier trotzdem explizit gesetzt, damit es sichtbar
; und nicht nur implizit richtig ist.
board_build.flash_size = 4MB

; Single-App-Partitionierung ohne OTA (Alex' bewusste Entscheidung, OTA ist
; fuer dieses private Projekt nicht geplant) - EIN grosser App-Slot (3MB,
; huge_app.csv Standard-Schema von Espressif) statt der zwei kleineren
; OTA-Slots (je ca. 1,3MB) aus dem default-Schema. NVS bleibt erhalten
; (falls die WiFi-Bibliothek es braucht), SPIFFS/LittleFS werden nicht
; genutzt (Konfiguration liegt auf der SD-Karte), die ungenutzte
; spiffs-Partition aus huge_app.csv bleibt einfach leer/unformatiert.
board_build.partitions = huge_app.csv

; XPT2046_Touchscreen ist NICHT hier gelistet, sondern als lokal
; gepatchter Fork in lib/XPT2046_Touchscreen/ vendort (siehe dessen
; README_PATCH.md und CLAUDE.md "Wischgeste empfindlicher") - PlatformIO
; findet Bibliotheken in lib/ automatisch, ein zusaetzlicher lib_deps-
; Eintrag wuerde nur zu einer Namenskollision mit dem Original-Paket
; fuehren.
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=1000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
